name: Ingest Pride Guys ESPN Historical Data

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year to backfill (e.g. 2020 or all)'
        required: true
        default: '2020'

permissions:
  contents: write

jobs:
  ingest_historical:
    name: 🏈 Ingest Pride Guys Historical Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ingest Historical ESPN Season
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID || '1629523' }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          if [ "${{ github.event.inputs.season }}" = "all" ]; then
            node scripts/ingest_espn_historical.js --all
          else
            node scripts/ingest_espn_historical.js --season ${{ github.event.inputs.season }}
          fi

      - name: Run Vitest Suite
        run: npm test

      - name: Commit & Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain public/data/)" ]; then
            git add public/data/
            git commit -m "chore(data): Ingest Pride Guys ESPN historical data for ${{ github.event.inputs.season }} [skip ci]"
            git push origin main
            echo "✅ Successfully committed and pushed historical Pride Guys dataset!"
          else
            echo "ℹ️ No changes detected in league dataset."
          fi
