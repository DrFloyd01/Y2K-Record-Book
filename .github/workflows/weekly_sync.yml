name: Weekly Fantasy Record Books Sync

on:
  schedule:
    # Runs every Tuesday at 11:00 UTC (4:00 AM PT / 7:00 AM ET) after Monday Night Football
    - cron: '0 11 * * 2'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync_fantasy_data:
    name: 🏈 Fetch & Ingest ESPN & Yahoo Scores
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 1. Sync ESPN Pride Guys Scores
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID || '1629523' }}
          ESPN_SEASON: '2026'
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/update_espn_scores.js

      - name: 2. Sync Yahoo Y2K Record Book Scores
        run: node scripts/sync_yahoo_direct.js

      - name: Run Automated Vitest Tests
        run: npm test

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain public/data/)" ]; then
            git add public/data/
            git commit -m "chore(data): Auto-sync ESPN & Yahoo weekly scores [skip ci]"
            git push
            echo "✅ New scores and standings committed and pushed to main!"
          else
            echo "ℹ️ No changes detected in league datasets."
          fi
